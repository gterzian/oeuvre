[package]
name = "agent-browser-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
automation = { path = "../../formal-web/automation" }
env_logger = "0.11"
ipc_messages = { path = "../../formal-web/ipc_messages" }
keyboard-types = "0.8"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview = { path = "../../formal-web/webview" }

[profile.release]
debug = 1
